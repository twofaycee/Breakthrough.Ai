<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Confirm your email — BREAKTHROUGH</title>
</head>
<body style="margin:0;padding:0;background-color:#050505;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background-color:#050505;">
    <tr>
      <td align="center" style="padding-top:44px;padding-bottom:44px;padding-left:20px;padding-right:20px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#0b0b0d;border:1px solid #27272b;">
          <tr>
            <td align="center" style="padding-top:38px;padding-bottom:28px;padding-left:32px;padding-right:32px;">
              <img src="https://breakthrough-five.vercel.app/brand/breakthrough-mark.svg" width="72" height="72" border="0" style="width:72px;height:72px;display:block;" alt="BREAKTHROUGH">
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:10px;padding-left:32px;padding-right:32px;">
              <p style="margin:0;font-size:12px;line-height:18px;color:#a9adb5;letter-spacing:5px;font-weight:600;">BREAKTHROUGH</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-top:12px;padding-bottom:12px;padding-left:40px;padding-right:40px;">
              <h1 style="margin:0;font-size:32px;line-height:42px;color:#f5f5f5;font-weight:600;">Confirm your email</h1>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-top:4px;padding-bottom:28px;padding-left:48px;padding-right:48px;">
              <p style="margin:0;font-size:16px;line-height:26px;color:#b8bac1;">Confirm your email address to finish creating your BREAKTHROUGH account.</p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-bottom:34px;padding-left:32px;padding-right:32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#f5f5f5" style="background-color:#f5f5f5;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding-top:14px;padding-bottom:14px;padding-left:34px;padding-right:34px;font-size:15px;line-height:20px;color:#050505;text-decoration:none;font-weight:700;">Confirm email</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding-top:1px;padding-bottom:1px;padding-left:32px;padding-right:32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td style="height:1px;background-color:#27272b;font-size:1px;line-height:1px;">&nbsp;</td></tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-top:26px;padding-bottom:38px;padding-left:40px;padding-right:40px;">
              <p style="margin:0 0 8px 0;font-size:13px;line-height:20px;color:#777b84;">If you didn’t create a BREAKTHROUGH account, you can safely ignore this email.</p>
              <p style="margin:0;font-size:12px;line-height:18px;color:#555861;">This confirmation link is unique to your account.</p>
            </td>
          </tr>
        </table>
        <p style="margin:20px 0 0 0;font-size:11px;line-height:17px;color:#555861;">© 2026 BREAKTHROUGH</p>
      </td>
    </tr>
  </table>
</body>
</html>
