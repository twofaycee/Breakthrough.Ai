name: Sync BREAKTHROUGH v19 source
on:
  push:
    branches: [breakthrough-v19-sync]

jobs:
  sync:
    if: github.event.head_commit.message != 'Sync BREAKTHROUGH v19 source'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild v19 archive
        run: |
          cat v19-parts/part.* > /tmp/v19.zip.b64
          base64 -d /tmp/v19.zip.b64 > /tmp/v19.zip
          rm -rf ./* ./.??* || true
          unzip -oq /tmp/v19.zip -d .
          rm -rf v19-parts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync BREAKTHROUGH v19 source' || true
          git push
